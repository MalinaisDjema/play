<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крестики-нолики</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
  <h1>Крестики-нолики</h1>

  <div id="mode-switch">
    <button class="mode-btn active" data-mode="pvp">Игрок против игрока</button>
    <button class="mode-btn" data-mode="pvc">Игрок против компьютера</button>
  </div>

  <div id="status">Ход: X</div>

  <div id="scoreboard">
    <div class="score-item">
      <span class="score-label">X</span>
      <span id="scoreX" class="score-value">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">Ничьи</span>
      <span id="scoreDraw" class="score-value">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">O</span>
      <span id="scoreO" class="score-value">0</span>
    </div>
  </div>

  <div id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
  </div>

  <button id="restart">Новая игра</button>
  <button id="resetScore">Сбросить счёт</button>

  <script src="js/script.js"></script>
</body>
</html>
